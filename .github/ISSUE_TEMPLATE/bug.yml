name: 🐞 Report a bug
description: Something doesn't work in the app or the guide
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Before submitting, remove the tablet's **serial number** and **unlock code** from any logs,
        and don't attach copyrighted books or covers. English or Italian is fine.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [FireReader app, PDF reader, Unlock / guide, Windows driver, Virtual machine, Other]
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Device and system
      placeholder: "Fire HD 8 2017, LineageOS 15.1 (20211031)"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: FireReader version
      placeholder: "3.1.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happens instead
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "adb logcat -d | grep -i firereader"
      render: text
