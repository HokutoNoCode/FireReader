name: 💡 Suggest an idea
description: A new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      placeholder: "When I read in the evening I'd like..."
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it?
    validations: { required: true }
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
